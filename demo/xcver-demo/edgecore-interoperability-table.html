<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edgecore 交換器 × 光模組互連性查詢</title>
<style>
:root{
  --bg:#fff; --panel:#fff; --ink:#16191d; --muted:#5d6672; --line:#dfe3e8;
  --accent:#0b62d6; --accent-soft:#e8f0fd; --panel-line:#e6e9ee;
  --ok:#0d7a3f; --ok-bg:#e6f4ec; --warn:#8a5a00; --warn-bg:#fdf3e0; --err:#b3261e;
  --info:#1a5fa8; --info-bg:#e8f1fb; --no:#a3211f; --no-bg:#fceceb;
  --radius:8px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
/* ★ 預設一律淺色，不跟隨系統的暗色偏好 ——
   這頁是給業務在客戶面前開的，背景要能預期，不要因為某人的筆電設了暗色
   就變成深色。暗色仍然可用，但必須由使用者自己按「切換佈景」。 */
:root[data-theme="dark"]{
  --bg:#14171b; --panel:#1b1f24; --ink:#e7eaee; --muted:#98a2af; --line:#2c323a;
  --accent:#5ea0ff; --accent-soft:#17233a; --panel-line:#2c323a;
  --ok:#5cc98a; --ok-bg:#132a1e; --warn:#e0ad55; --warn-bg:#2c2413; --err:#f28b82;
  --info:#7db4ee; --info-bg:#14202f; --no:#f08a86; --no-bg:#2d1817;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.themebtn{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:var(--radius);padding:5px 11px;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:0 0 11px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
select,input[type=search]{flex:1;min-width:130px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;font-family:inherit}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.meta{font-size:12.5px;color:var(--muted);margin:8px 0 0}
/* 埠位模式清單已收進提示框，這個方塊不再需要捲軸 ——
   而且 overflow:auto 會把提示框裁掉。 */
.modes{margin:8px 0 0;padding:9px 11px;background:var(--bg);border-radius:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow:visible}
.modes b{color:var(--ink);font-weight:600;display:block;margin-bottom:0;
  font-family:inherit;font-size:12px;position:relative}
.modes .pn{margin:5px 0 0;font-size:11px;line-height:1.5;opacity:.85}
.list{margin-top:9px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.item{padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.item:last-child{border-bottom:none}
.item:hover{background:var(--accent-soft)}
.item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item.dim{opacity:.42}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
  margin:2px 0 0;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);cursor:pointer}
.item .mn{font-weight:600;font-family:var(--mono);font-size:13px}
.item .md{color:var(--muted);font-size:12px;margin-top:1px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);margin-left:5px;vertical-align:1px}
.tag.avl{font-weight:600;cursor:help}
.tag.avl-p{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.avl-n{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.b-verified{background:var(--ok-bg);color:var(--ok)}
.b-supported{background:var(--info-bg);color:var(--info)}
.b-theoretical{background:var(--warn-bg);color:var(--warn)}
.results{margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12.5px}
.scroll{overflow-x:auto}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.note{font-size:12px;color:var(--warn);margin-top:3px}
.why{text-align:left;max-width:760px;margin:0 auto}
.whyh{font-weight:600;font-size:14px;margin-bottom:9px;color:var(--err)}
.whyr{background:var(--warn-bg);color:var(--warn);border-radius:6px;
  padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.6}
.whyt{margin-top:10px;font-size:12.5px}
.whyt td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.whyk{color:var(--muted);font-size:11px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.05em}
.note.danger{color:var(--err);font-weight:600;border-left:2px solid currentColor;
  padding-left:6px}
.cbar{margin-bottom:14px}
.cbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbrow .row{display:flex;gap:6px;margin:0}
.cbrow select{width:auto;min-width:150px}
.cbk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cbarrow{color:var(--muted);font-size:16px;margin:0 6px}
.cbmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.cbmodes .modes{margin:0}
@media (max-width:820px){.cbmodes{grid-template-columns:1fr}}
tr.dimrow{opacity:.55}
tr.dimrow td{background:var(--bg)}
.help{display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;border:1px solid var(--line);
  color:var(--muted);font-size:11px;font-weight:700;cursor:help;
  position:relative;vertical-align:1px;margin-left:2px}
.help:hover,.help:focus{border-color:var(--accent);color:var(--accent);outline:none}
.help .tip{display:none;position:absolute;left:0;top:22px;z-index:50;
  width:min(620px,92vw);max-height:70vh;overflow-y:auto;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);
  font-size:12px;font-weight:400;color:var(--fg);line-height:1.6;cursor:auto}
.help:hover .tip,.help:focus .tip{display:block}
.help .tip b{display:block;margin:10px 0 4px;font-size:11.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.help .tip b:first-child{margin-top:0}
.help .tip table{width:100%;border-collapse:collapse;font-size:11.5px}
.help .tip td{padding:2px 8px 2px 0;border:none;vertical-align:top}
.help .tip td.k{font-family:var(--mono);white-space:nowrap;font-weight:600}
.help .tip td.n{color:var(--muted)}
.help .tip .tipnote{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11.5px}
.help .tip .tipnote b{display:inline;margin:0;font-size:inherit;color:var(--ink);
  text-transform:none;letter-spacing:0}
.modes .help .tip{width:min(420px,88vw);font-family:inherit}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted);line-height:1.7}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45}
.sub2{color:var(--muted);font-weight:400}
.cmb{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;margin:0 4px 4px 0;font-size:12px;font-family:var(--mono);white-space:nowrap}
.cbl{margin-bottom:7px}.cbl:last-child{margin-bottom:0}
.pn{font-weight:600;font-size:12.5px}
.nosku{color:var(--muted);font-style:italic}
.lnk{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;
  padding:2px 0;font-family:inherit}
.pnlist{margin:5px 0 2px;padding:7px 9px;background:var(--bg);border-radius:6px}
.pnlist table{font-size:11.5px}
.pnlist th{padding:2px 8px 4px 0;font-size:10.5px}
.pnlist td{padding:2px 8px 2px 0;border:none}
.part{margin-bottom:9px}.part:last-child{margin-bottom:0}
.prow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lensel{min-width:0;width:auto;margin:0;padding:1px 4px;font-size:11px}
.cp{background:none;border:1px solid var(--line);border-radius:5px;color:var(--muted);
  cursor:pointer;font-size:11px;line-height:1.35;padding:2px 5px;font-family:inherit}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.cp.done{color:var(--ok);border-color:var(--ok)}
.copy.done{color:var(--ok);border-color:var(--ok)}
td{min-width:150px}
.seg{display:inline-flex;margin:0 0 14px;border:1px solid var(--line);
  border-radius:7px;overflow:hidden}
.seg button{background:var(--panel);border:none;border-right:1px solid var(--line);
  color:var(--muted);font-size:12.5px;padding:5px 14px;cursor:pointer;
  font-family:inherit}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button:not(.on):not(:disabled):hover{background:var(--accent-soft);color:var(--accent)}
.seg.alt{margin-left:8px}
.seg.alt button{color:var(--accent)}
/* 全品項浮層。★ 顯示與否完全由自己管 —— 不經過 layout()，
   那支函式負責的是 A/B 面板在不同模式下的版面。 */
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
  justify-content:center;padding:24px;background:rgba(0,0,0,.45)}
.ovl[hidden]{display:none}
.ovlbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ovlhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 16px;border-bottom:1px solid var(--line)}
.ovlhd h2{margin:0;font-size:15px}
.ovlhd .sub{color:var(--muted);font-size:12.5px}
.ovlhd input{flex:1;min-width:140px}
.ovlbody{overflow-y:auto;padding:6px 10px 12px}
.ovlx{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;
  cursor:pointer;padding:0 4px;font-family:inherit}
.ovlx:hover{color:var(--fg)}
.copy{background:var(--panel);border:1px solid var(--line);color:var(--accent);
  border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;
  font-family:inherit}
.copy:hover{background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Edgecore 交換器 × 光模組互連性查詢</h1>
  <span class="sub" id="stat"></span>
  <button class="themebtn" id="theme">切換佈景</button>
</header>

<!-- 分類切換。★ 固定在這裡，不隨模式搬動 ——
     先前它掛在 A 面板裡，切到 AOC/DAC 時要跟著搬到壓縮列，按鈕會跳位置。 -->
<div class="seg" id="catSel">
  <button data-cat="x" class="on">光模組</button>
  <button data-cat="aoc">AOC</button>
  <button data-cat="dac">DAC</button>
</div>
<div class="seg alt" id="allSel">
  <button data-all="x">全部光模組</button>
  <button data-all="c">全部線材</button>
</div>

<!-- 全品項清單。跟 A/B 面板無關，單純把手上的產品全部列出來。 -->
<div class="ovl" id="allOvl" hidden>
  <div class="ovlbox" role="dialog" aria-modal="true" aria-labelledby="allTitle">
    <div class="ovlhd">
      <h2 id="allTitle"></h2>
      <span class="sub" id="allCnt"></span>
      <input id="allQ" placeholder="搜尋…">
      <button class="ovlx" id="allClose" title="關閉（Esc）">&times;</button>
    </div>
    <div class="ovlbody" id="allBody"></div>
  </div>
</div>

<!-- AOC/DAC 模式用的壓縮選擇列。裡面的下拉選單是從下方面板「搬」過來的，
     不是另外複製一份 —— 複製就要同步兩邊狀態，遲早不一致。 -->
<div class="panel cbar" id="cbar" style="display:none">
  <div class="cbrow" id="cbrow">
    <span class="cbk">A 端</span><span id="cbA"></span>
    <span class="cbarrow">⟷</span>
    <span class="cbk">B 端</span><span id="cbB"></span>
  </div>
  <div class="cbmodes"><span id="cbMA"></span><span id="cbMB"></span></div>
</div>

<div class="grid" id="grid">
  <div class="panel">
    <h2>A 端</h2>
    <span id="homeA"></span>
    <div class="row" id="rowA"><select id="swA"></select><select id="pgA"></select></div>
    <div class="modes" id="modeA"></div>
    <div class="row" id="qArow" style="margin-top:9px"><input type="search" id="qA" placeholder="搜尋型號或規格…"></div>
    <div class="meta" id="cntA"></div>
    <div class="list" id="listA"></div>
  </div>

  <div class="panel">
    <h2>B 端（對端）</h2>
    <span id="homeB"></span>
    <div class="row" id="rowB"><select id="swB"></select><select id="pgB"></select></div>
    <div class="modes" id="modeB"></div>
    <div class="row" id="qBrow" style="margin-top:9px"><input type="search" id="qB" placeholder="搜尋模組型號或規格…"></div>
    <label class="chk" id="onlyLinkWrap"><input type="checkbox" id="onlyLink" checked> 只顯示可與 A 端對接的模組</label>
    <div class="meta" id="cntB"></div>
    <div class="list" id="listB"></div>
  </div>
</div>

<div class="panel results">
  <h2 id="resTitle">可對接的組合</h2>
  <label class="chk" id="aocOnlyWrap" style="display:none">
    <input type="checkbox" id="aocOnly" checked> 只顯示接得起來的線材</label>
  <div class="legend">
    <span><span class="badge b-verified">verified</span> 已實測</span>
    <span><span class="badge b-supported">supported</span> 規格已確認</span>
    <span><span class="badge b-theoretical">theoretical</span> 規格待確認</span>
  </div>
  <div class="legend" id="avlLegend">
    <span><span class="tag avl avl-p">AVL</span> 已通過</span>
    <span><span class="tag avl avl-n">還沒 AVL</span> 其餘</span>
    <span>模組清單上的標記，滑過去看哪一家什麼狀態</span>
  </div>
  <div class="scroll"><table>
    <thead id="resHead"></thead>
    <tbody id="res"></tbody>
  </table></div>
  <div class="empty" id="resEmpty">請先在左側選擇 A 端的交換器、埠位與模組。</div>
</div>

<footer id="foot"></footer>
</div>

function reach(m){

  return v>=1000 ? (v/1000)+' km' : v+' m';
}
function pgKey(sw,pg){ return sw+'.'+pg; }

// ── 選單 ────────────────────────────────────────────────
function fillSwitches(sel, side){
  const grp = (label, kind) => {
    const rows = P.map((p,i)=>[p,i]).filter(([p])=>(p.k||'switch')===kind);
    if(!rows.length) return '';
    return `<optgroup label="${esc(label)}">` + rows.map(([p,i])=>
      `<option value="${i}">${esc(p.n)}${p.sc?' — '+esc(p.sc):''}</option>`).join('') + '</optgroup>';
  };
  sel.innerHTML = grp('Edgecore 交換器','switch') + grp('網卡','nic');
  sel.value = st[side].sw;
}
function fillGroups(sel, side){
  const p = P[st[side].sw];
  sel.innerHTML = p.g.map((g,i)=>`<option value="${i}">${esc(g.l)}</option>`).join('');
  if(st[side].pg >= p.g.length) st[side].pg = 0;
  sel.value = st[side].pg;
}
// 晶片與埠位資訊。埠位模式清單有時十幾行，佔掉整個面板 ——
// 收進行尾的 ! 裡，需要時才展開。
function showModes(el, side){
  const p = P[st[side].sw], g = p.g[st[side].pg];
  // ★ 這份清單一律是「晶片做得到什麼」，不是「這台保證支援什麼」。
  //
  //   即使來自 platform.json 也一樣 —— 那是平台設計時宣告的 breakout 模式，
  //   出貨的機器是否真的開放，還要看韌體與 NOS 版本。寫成「平台開放」
  //   等於替它背書，是我不該做的。
  //
  //   兩種來源的可信度確實不同，但差別放在來源說明裡講，標題不分。
  const tip = g.modes.length
    ? `<b>晶片可產生的埠位模式（${g.modes.length}）</b>`
      + `<table>${g.modes.map(m=>`<tr><td class="k">${esc(m)}</td></tr>`).join('')}</table>`
      + `<div class="tipnote">左邊的數字是這個實體埠會切成幾個邏輯埠，`
      + `括號裡是每個邏輯埠用幾條通道、每條跑多少速率。<br>`
      + (g.pm
          ? '來源：該平台 SONiC platform.json 宣告的 breakout 模式。'
            + '那是<b>設計時定義</b>的，實際可用仍取決於韌體與 NOS 版本。'
          : '來源：ASIC 的 SerDes 能力推導，該平台沒有 platform.json 可參照。'
            + '這是<b>晶片做得到</b>的組合，平台設計時未必把這些通道都接出來。')
      + '導入前請以該機型的 NOS 設定為準。'
      + `</div>`
    : '';
  const head = `<b>${(p.k==='nic'?esc(p.vd)+' · ':'')}${esc(p.asic)}`
    + (p.tp?` · ${esc(p.tp)}`:'') + ` · ${esc(g.cage)} 埠位 ×${g.c}`
    + (g.hs ? ` · ${esc(g.hs)} 散熱` : '')
    + (g.modes.length ? ` · 晶片可產生 ${g.modes.length} 種埠位模式` : '')
    + (tip ? ` <span class="help" tabindex="0">!<span class="tip">${tip}</span></span>`
           : '')
    + `</b>`;
  const pn = (p.pn && p.pn.length)
    ? `<div class="pn">料號：${p.pn.map(esc).join('、')}</div>` : '';
  el.innerHTML = head + pn
    + (g.modes.length ? '' : '固定銅纜埠位，不使用可插拔模組');
}

// AVL 小標記。只有內部版會帶 avl 欄位，對外版拿到空字串就不畫。
const AVL_LABEL = {p:'AVL', n:'還沒 AVL'};
function avlTag(x){
  if(!x.avl || !AVL_LABEL[x.avl]) return '';
  const t = (x.avlt && x.avlt.length) ? esc(x.avlt.join('\n')) : '';
  return `<span class="tag avl avl-${x.avl}"${t?` title="${t}"`:''}>${AVL_LABEL[x.avl]}</span>`;
}

function renderListA(){
  if(st.cat !== 'x') return renderPanelCable('a');
  const ids = compatModules(st.a.sw, st.a.pg);
  const q = $('qA').value.trim().toLowerCase();
  const hit = ids.filter(i => !q || (X[i].m+' '+X[i].s+' '+X[i].d+' '+X[i].f).toLowerCase().includes(q));
  $('cntA').textContent = `此埠位可用模組 ${ids.length} 種` + (q?`，符合搜尋 ${hit.length} 種`:'');
  if(st.a.x!==null && !hit.includes(st.a.x)) st.a.x = null;
  $('listA').innerHTML = hit.length ? hit.map(i=>{
    const x = X[i];
    return `<div class="item ${st.a.x===i?'sel':''}" data-x="${i}">
      <div class="mn">${esc(x.m)}<span class="tag">${esc(x.f)}</span>${x.hs?`<span class="tag">${esc(x.hs)}</span>`:''}${x.gb?'<span class="tag">gearbox</span>':''}${avlTag(x)}</div>
      <div class="md">${esc(x.s)} · ${esc(x.cn)} · ${esc(x.md)} · ${reach(i)}</div></div>`;

// ── 配對：H 查表 → M 查表 ───────────────────────────────
// 只有查表與整理，沒有任何判斷規則 —— 規則都在建置階段算完了。
function pairRows(xa, xbList){
  const fa = fitsFor(st.a.sw, st.a.pg, xa);
  const rows = [];
  for(const xb of xbList){
    const fb = fitsFor(st.b.sw, st.b.pg, xb);
    for(const [eca, opa, cfa, lba] of fa){
      for(const [ecb, opb, cfb, lbb] of fb){
        const r = (M[eca]||{})[ecb];
        if(!r) continue;
        const [ratio, big, cab, kind, notes, nCab] = r;
        const tkey = P[st.a.sw].id+'|'+X[xa].m+'|'+P[st.b.sw].id+'|'+X[xb].m;
        const status = (tkey in T) ? 'verified' : ((cfa&&cfb) ? 'supported' : 'theoretical');
        // 有正式料號的優先；一旦有，通用型的佔位項目就別再佔版面
        const real = cab.filter(i => C[i].sku);
        const cabUse = real.length ? real : [...cab];
        rows.push({xb, ratio, big, cab: cabUse, kind: S[kind], nCab, status,
                   spA: E[eca].sp, ka: E[eca].k, kb: E[ecb].k,
                   reach: Math.min(X[xa].r, X[xb].r),
                   notes: notes.map(n=>S[n])});
      }
    }
  }
  return rows;
}

// A 端選定的模組能對接哪些 B 端模組
function linkableB(){
  if(st.a.x === null) return null;
  return new Set(pairRows(st.a.x, compatModules(st.b.sw, st.b.pg)).map(r=>r.xb));
}

// ── B 端模組清單 ────────────────────────────────────────
function renderListB(){
  if(st.cat !== 'x') return renderPanelCable('b');
  const ids = compatModules(st.b.sw, st.b.pg);
  const linkable = linkableB();
  const onlyLink = $('onlyLink').checked;
  const q = $('qB').value.trim().toLowerCase();

  let hit = ids.filter(i => !q || (X[i].m+' '+X[i].s+' '+X[i].d+' '+X[i].f).toLowerCase().includes(q));
  if(onlyLink && linkable) hit = hit.filter(i => linkable.has(i));

  $('cntB').textContent = st.a.x === null
    ? `此埠位可用模組 ${ids.length} 種。選擇 A 端模組後，這裡會標出可對接的。`
    : `此埠位可用模組 ${ids.length} 種，其中 ${linkable.size} 種可與 ${X[st.a.x].m} 對接`
      + (q ? `，符合搜尋 ${hit.length} 種` : '')
      + '。點選淡色的可查看不能對接的原因。';

  if(st.b.x !== null && !hit.includes(st.b.x)) st.b.x = null;

  $('listB').innerHTML = hit.length ? hit.map(i=>{
    const x = X[i];
    const dim = linkable && !linkable.has(i) ? ' dim' : '';
    return `<div class="item${st.b.x===i?' sel':''}${dim}" data-x="${i}">
      <div class="mn">${esc(x.m)}<span class="tag">${esc(x.f)}</span>${x.hs?`<span class="tag">${esc(x.hs)}</span>`:''}${x.gb?'<span class="tag">gearbox</span>':''}${avlTag(x)}</div>
      <div class="md">${esc(x.s)} · ${esc(x.cn)} · ${esc(x.md)} · ${reach(i)}</div></div>`;
  }).join('') : `<div class="empty">${
      st.a.x !== null && onlyLink
        ? `此埠位沒有能與 ${esc(X[st.a.x].m)} 對接的模組。取消勾選可看全部。`
        : '此埠位沒有可用的模組。'}</div>`;

  $('listB').querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>{
      const v = +el.dataset.x;
      st.b.x = (st.b.x === v) ? null : v;   // 再點一次取消，回到列出全部
      renderListB(); renderResults();
    };
  });
}

// 目前分類的顯示名稱。所有對使用者的字串都走這裡 ——
// 硬寫「AOC」在 DAC 模式下會變成錯的訊息。
const catName = () => st.cat === 'dac' ? 'DAC' : 'AOC';

const aocKey = side => `${st[side].sw}.${st[side].pg}`;

function aocRoles(side, ai){ return (AH[aocKey(side)] || {})[ai] || []; }

// 兩端任一插得上的整合式線材（依目前選的分類過濾）。
//
// ★ 要對稱 —— 只看 A 端的話，把 A/B 對調清單就變了，使用者會以為是 bug。
function aocCandidates(){
  const set = new Set([...Object.keys(AH[aocKey('a')] || {}),
                       ...Object.keys(AH[aocKey('b')] || {})].map(Number));
  return [...set].filter(i => AC[i].kind === st.cat)
    .sort((x,y) => AC[x].id.localeCompare(AC[y].id));
}

// 這條 AOC 能不能接在目前的 A/B 兩個埠位之間，回傳兩端的角色
function aocPair(ai){
  const ra = aocRoles('a', ai), rb = aocRoles('b', ai);
  for(const x of ra) for(const y of rb) if(x !== y) return [x, y];
  return null;
}

function aocEnd(c, role){ return role === 'a' ? c.a : c.b; }

// AOC / DAC 模式下的面板內容。
//
// ★ 整合式線材只有「一條線」要選，不是兩端各選一個 —— 兩邊擺一樣的清單
//   會讓人不知道該按哪邊。所以兩個面板只負責選交換器與埠位，
//   線材清單移到下方結果區，跟使用者的實際流程一致：
//   先決定兩台機器，再挑線。
function renderPanelCable(side){
  const n = Object.keys(AH[aocKey(side)] || {}).map(Number)
    .filter(i => AC[i].kind === st.cat).length;   // 這一端自己插得上幾種
  const cnt = side === 'a' ? 'cntA' : 'cntB';
  const list = side === 'a' ? 'listA' : 'listB';
  $(cnt).textContent = n
    ? `此埠位可插 ${n} 種 ${catName()}`
    : `此埠位沒有可用的 ${catName()}`;
  // ★ 只負責內容，顯示與否一律由 layout() 決定 ——
  //   先前在這裡設 display:none，切回光模組時沒人還原，清單就永遠不見了。
  $(list).innerHTML = '';
}

// 結果列：把 A 端插得上的線材全部列出來，接不到對端的也列，附原因。
// 可用的排前面 —— 使用者要的是答案，不是清單。
function aocRows(){
  const onlyOk = $('aocOnly').checked;
  const out = [];
  for(const ai of aocCandidates()){
    const c = AC[ai];
    const pr = aocPair(ai);
    if(onlyOk && !pr) continue;
    out.push(pr
      ? {ai, roleA: pr[0], roleB: pr[1], ok: true}
      : {ai, ok: false, fitA: aocRoles('a', ai), fitB: aocRoles('b', ai)});
  }
  out.sort((x, y) => (y.ok - x.ok) || AC[x.ai].id.localeCompare(AC[y.ai].id));
  return out;
}

// ── 結果表 ──────────────────────────────────────────────
//
// 一列 = 一個完整可下單的組合：A 端模組、B 端模組、中間的光纖線材
// 並排在同一列。同一組配對在不同速率下可能有多種 breakout
// （800G 1:1、400G 2:2、200G 4:4…），全部收在「速率」欄，
// 不再每種各佔一列 —— 對挑料號的人那是雜訊。
//
// 每個部件的 Model Name / PN / Description 都能單獨複製；
// 列尾的按鈕則複製整列三個部件（含數量），TSV 可直接貼進 Excel。
function mergeRows(rows){
  const g = new Map();
  for(const r of rows){
    const key = r.xb + '|' + r.ratio + '|' + r.big + '|' + r.cab.join(',');
    if(!g.has(key)) g.set(key, {...r, combos: []});
    const e = g.get(key);
    e.combos.push({sp: r.spA, ka: r.ka, kb: r.kb});
    if(r.status === 'verified') e.status = 'verified';
    else if(r.status === 'supported' && e.status === 'theoretical') e.status = 'supported';
  }
  for(const e of g.values()){
    const best = new Map();          // 同速率只留通道數最少的（最常見接法）
    for(const c of e.combos){
      const cur = best.get(c.sp);
      if(!cur || c.ka < cur.ka) best.set(c.sp, c);
    }
    e.combos = [...best.values()].sort((a,b)=>b.sp-a.sp);
  }
  return [...g.values()];
}

const fmtSpeed = g => g>=1000 ? (g/1000)+'T' : g+'G';
// 顯示用：主要料號。多來源時備選另外標註，不要串成「A / B」——
// 那樣看起來像一個料號，複製進 BOM 也不能用。
const pnOf = x => x.pn1 || ((x.pn && x.pn.length) ? x.pn[0] : '');
const pnNote = x => {
  const bits = [];
  if(x.pnalt && x.pnalt.length) bits.push('另有備選：' + x.pnalt.join('、'));
  if(x.pnwarn) bits.push(x.pnwarn);
  return bits.join('；');
};

// 描述裡的 <L>M 是長度佔位符，選定長度後換成實際值
const withLen = (desc, L) => (desc||'').replace(/<L>M/g, L != null ? L+'M' : '');

// 預設選有料號的最短長度 —— BOM 用得上的才有意義
function defaultSku(c){
  const sk = c.skus || [];
  const i = sk.findIndex(k => k.p);
  return i >= 0 ? i : 0;
}

const cpBtn = (p, ri, ci) =>
  `<button class="cp" data-p="${p}" data-ri="${ri}"${ci!=null?` data-ci="${ci}"`:''}`
  + ` title="複製 Model Name / Part Number / Description">⧉</button>`;

// 模組欄：Model Name / PN / 描述三行，右上角一顆複製鈕
function partCell(model, pn, desc, tag, btn, note){
  return `<div class="part">`
       + `<div class="prow"><span class="mono pn">${esc(model)}</span>`
       + (tag ? `<span class="tag">${esc(tag)}</span>` : '') + (btn||'')
       + `</div>`
       + (pn ? `<div class="sub mono">${esc(pn)}</div>`
             : '<div class="sub nosku">無料號</div>')
       + (note ? `<div class="sub note">${esc(note)}</div>` : '')
       + (desc ? `<div class="sub">${esc(desc)}</div>` : '')
       + `</div>`;
}

// 線材欄：長度選單就接在 model name 後面，換長度會同步換料號與描述
function cableCell(idx, ri, ci){
  const c = C[idx];
  // Edgecore 沒有這個型式的料號。講清楚比只顯示「無料號」有用 ——
  // 使用者要知道的是「要自己找貨源」，不是「料號待補」。
  if(!c.sku)
    return `<div class="part"><div class="prow">`
      + `<span class="mono pn nosku">${esc(c.l)}</span>`
      + `<span class="tag">Edgecore 無此料號</span></div>`
      + `<div class="sub">${esc(c.spec || c.desc || '')}</div>`
      + `<div class="sub note">此線材型式 Edgecore 未建立料號，需另行採購</div></div>`;
  const sk = c.skus || [];
  const d0 = defaultSku(c);
  const f = sk[d0] || {};
  const sel = sk.length
    ? `<select class="lensel" data-ri="${ri}" data-ci="${ci}">`
      + sk.map((k,n)=>`<option value="${n}"${n===d0?' selected':''}>`
                      + `${k.L} m${k.p?'':'（無料號）'}</option>`).join('')
      + '</select>' : '';
  return `<div class="part cbl">`
    + `<div class="prow"><span class="mono pn cbl-m">${esc(f.m || c.id)}</span>`
    + sel + cpBtn('c', ri, ci) + `</div>`
    + `<div class="sub mono cbl-p">${f.p ? esc(f.p) : '<span class="nosku">無料號</span>'}</div>`
    + `<div class="sub cbl-d">${esc(withLen(c.desc || c.l, f.L))}</div></div>`;
}

// 目前畫面上選中的長度（使用者可能已經改過下拉選單）
function skuOf(ri, ci){
  const sel = document.querySelector(`.lensel[data-ri="${ri}"][data-ci="${ci}"]`);
  const c = C[rowsCache[ri].cab[ci]];
  const sk = c.skus || [];
  if(!sk.length) return null;
  return sk[sel ? +sel.value : defaultSku(c)];
}

const TSV = a => a.join('\t');

// 單一部件的三個欄位；qty 給整列 BOM 用
function partTsv(kind, ri, ci){
  const r = rowsCache[ri];
  const qa = r.big === 'A' ? 1 : r.ratio, qb = r.big === 'A' ? r.ratio : 1;
  // ★ BOM 只能填一個料號。多來源時用 pn1（AVL 狀態最好的那個），
  //   備選放進描述 —— 貼成「A / B」會讓 Excel 那格沒辦法用。
  // ★ 沒有料號時料號欄不能留空白 —— 貼進 Excel 看起來像資料漏了，
  //   而不是「這顆還沒有料號」。型號欄照填，那是真的型號（跟線材那邊
  //   不同，線材沒料號時連型號都只是內部識別字）。
  const one = (x, q) => [x.m, x.pn1 || pnOf(x) || '（尚無料號）',
    (x.d || '') + (x.pnalt && x.pnalt.length
      ? `（另有備選料號：${x.pnalt.join('、')}）` : '')
      + (x.pnwarn ? `（注意：${x.pnwarn}）` : ''), q];
  if(kind === 'a') return one(X[st.a.x], qa);
  if(kind === 'b') return one(X[r.xb], qb);
  const c = C[r.cab[ci || 0]], k = skuOf(ri, ci || 0);
  // ★ 線材數量用 nCab，不是模組數量比 —— 800G-2DR4 對 8 顆 DR1
  //   只要 2 條 1 對 4 分接線，抄數量比會變成 8 條。
  //
  // ★ 沒有 Edgecore 料號時，型號欄不能填 c.id（那是內部識別字）——
  //   會在 BOM 裡變成一個看起來像產品、實際不存在的料。
  //   改成明確的標記 + 完整規格，讓採購知道要自己找貨源。
  if(!c.sku)
    return ['（Edgecore 無此料號，需另行採購）', '（尚無料號）',
            c.spec || c.l || '', r.nCab];
  return [k ? (k.m || c.id) : c.id, (k && k.p) || '（尚無料號）',
          withLen(c.desc || c.l || '', k && k.L), r.nCab];
}

// 整列 BOM：表頭 + A 端 + B 端 + 線材，含數量
function bomLines(ri){
  const out = [['Model Name', 'Part Number', 'Description', 'Qty'],
               partTsv('a', ri), partTsv('b', ri)];
  if(rowsCache[ri].cab.length) out.push(partTsv('c', ri, 0));
  return out.map(TSV).join('\n');
}

function copyText(text, btn, label){
  const done = ()=>{ const t = btn.textContent; btn.textContent = label || '已複製';
                     btn.classList.add('done');
                     setTimeout(()=>{ btn.textContent = t;
                                      btn.classList.remove('done'); }, 1200); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, ()=>fallback(text, done));
  } else fallback(text, done);
}

function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); } finally { ta.remove(); }
}

// 兩顆模組接不起來時，說明差在哪。
//
// 原因是建置階段算好的（R 表，鍵是線側輪廓），這裡只做查表 ——
// 判斷邏輯不在這個檔案裡。並排列出兩端的線側規格，差異一眼可見。
function profilesOf(side, xi){
  const s = st[side];
  const out = new Set();
  for(const [ec] of fitsFor(s.sw, s.pg, xi)) out.add(E[ec].p);
  return [...out];
}

function whyNot(xa, xb){
  const a = X[xa], b = X[xb];
  const reasons = new Set();
  for(const pa of profilesOf('a', xa))
    for(const pb of profilesOf('b', xb)){
      const r = (R[pa]||{})[pb];
      const r2 = (R[pb]||{})[pa];
      if(r !== undefined) reasons.add(S[r]);
      else if(r2 !== undefined) reasons.add(S[r2]);
    }
  // 線側相容但湊不出共同速率時，把兩端各自能跑的速率列出來 ——
  // 使用者才知道是要換埠位（例如改用支援分接的那組）還是換模組。
  const spOf = side => {
    const s = st[side], xi = side === 'a' ? xa : xb;
    return [...new Set(fitsFor(s.sw, s.pg, xi).map(f=>fmtSpeed(E[f[0]].sp)))];
  };
  const body = reasons.size
    ? [...reasons].map(t=>`<div class="whyr">${esc(t)}</div>`).join('')
    : `<div class="whyr">兩端的光訊號規格是相容的，但在目前選定的埠位上`
      + `找不到共同的速率：<br>`
      + `A 端 <b>${esc(P[st.a.sw].g[st.a.pg].l)}</b> 可跑 ${esc(spOf('a').join('、'))}；`
      + `B 端 <b>${esc(P[st.b.sw].g[st.b.pg].l)}</b> 可跑 ${esc(spOf('b').join('、'))}。<br>`
      + `若該設備另有支援分接的埠位，改選那一組即可；網卡的埠位不支援分接。</div>`;
  const row = (tag, m) => `<tr><td class="whyk">${tag}</td>`
    + `<td class="mono pn">${esc(m.m)}</td>`
    + `<td class="sub">${esc((m.spec||[]).join(' · '))}</td></tr>`;
  return `<div class="why"><div class="whyh">`
    + `${esc(a.m)} 與 ${esc(b.m)} 無法對接</div>${body}`
    + `<table class="whyt">${row('A 端', a)}${row('B 端', b)}</table></div>`;
}

let rowsCache = [];

// AOC 的結果表。一條線一列，長度用下拉選；BOM 只有一行 —— 線就是全部。
const HEAD_X = `<tr><th>A 端模組</th><th>B 端模組</th><th>光纖線材</th>`
  + `<th title="每個實體埠切成幾個邏輯埠、各跑多少速率">埠模式 · 數量</th>`
  + `<th>等級</th><th></th></tr>`;
const HEAD_AOC = `<tr><th>線材型號</th><th>A 端接頭</th><th>B 端接頭</th>`
  + `<th>速率</th><th>等級</th><th></th></tr>`;

let aocCache = [];

function aocDefaultSku(c){
  const i = (c.skus || []).findIndex(k => k.p);
  return i >= 0 ? i : 0;
}

function aocSku(ri){
  const sel = document.querySelector(`.aoclen[data-ri="${ri}"]`);
  const c = AC[aocCache[ri].ai];
  const sk = c.skus || [];
  if(!sk.length) return null;
  return sk[sel ? +sel.value : aocDefaultSku(c)];
}

function aocTsv(ri){
  const r = aocCache[ri], c = AC[r.ai], k = aocSku(ri);
  const ea = aocEnd(c, r.roleA), eb = aocEnd(c, r.roleB);
  const d = `${c.l}｜${ea.n}x ${ea.ff} (${ea.h}) 對 ${eb.n}x ${eb.ff} (${eb.h})`
          + (k ? `｜${k.L} m` : '');
  return [k ? k.m : c.id, (k && k.p) || '', d, 1];
}

function renderResultsAoc(){
  const tb = $('res'), emp = $('resEmpty');
  $('resHead').innerHTML = HEAD_AOC;
  tb.innerHTML = ''; aocCache = aocRows();
  if(!aocCache.length){
    emp.style.display = 'block';
    const total = aocCandidates().length;
    emp.innerHTML = total && $('aocOnly').checked
      ? `這兩個埠位之間沒有接得起來的 ${catName()}。`
        + `<br><span class="sub">取消上方的勾選，可以看到 ${total} 種`
        + `其中一端插得上的線材與接不起來的原因。</span>`
      : `這兩個埠位都插不上任何 ${catName()}。`;
    return;
  }
  emp.style.display = 'none'; emp.innerHTML = '';
  tb.innerHTML = aocCache.map((r, ri)=>{
    const c = AC[r.ai];
    // 接不到對端的：不給長度選單與複製鈕，改成說明為什麼
    const et = x => `${x.n > 1 ? x.n + 'x ' : ''}${x.ff}`;
    if(!r.ok){
      // 三種接不起來的情況，分開講 —— 籠統說「接不到」等於沒說
      const pa = P[st.a.sw].g[st.a.pg].l, pb = P[st.b.sw].g[st.b.pg].l;
      const why = !r.fitA.length
        ? `A 端（${esc(pa)}）插不下這條線的任何一頭`
        : !r.fitB.length
          ? `B 端（${esc(pb)}）插不下這條線的任何一頭`
          : `兩端都只插得下同一頭（${esc(et(aocEnd(c, r.fitA[0])))}），`
            + `而這條線需要一頭 ${esc(et(c.a))}、另一頭 ${esc(et(c.b))}`;
      return `<tr class="dimrow">
        <td><div class="part"><div class="prow">`
        + `<span class="mono pn">${esc(c.id)}</span></div>`
        + `<div class="sub">${esc(c.l)}</div></div></td>
        <td>${esc(et(c.a))}</td><td>${esc(et(c.b))}</td>
        <td class="sub">${c.a.sp}G</td>
        <td colspan="2" class="sub note">${why}</td></tr>`;
    }
    const ea = aocEnd(c, r.roleA), eb = aocEnd(c, r.roleB);
    const sk = c.skus || [];  // 可用的才有長度與料號
    const d0 = aocDefaultSku(c);
    const k = sk[d0] || {};
    const sel = sk.length
      ? `<select class="aoclen" data-ri="${ri}">`
        + sk.map((x,n)=>`<option value="${n}"${n===d0?' selected':''}>`
                        + `${x.L} m${x.p?'':'（無料號）'}</option>`).join('')
        + '</select>' : '';
    const end = e => `<div class="mono pn">${e.n > 1 ? e.n + 'x ' : ''}`
      + `${esc(e.ff)}</div><div class="sub">${esc(e.h)}　${e.sp}G/埠</div>`;
    return `<tr>
      <td><div class="part"><div class="prow">`
        + `<span class="mono pn aoc-m">${esc(k.m || c.id)}</span>${sel}`
        + cpBtnAoc(ri) + `</div>`
        + `<div class="sub mono aoc-p">${k.p ? esc(k.p)
             : '<span class="nosku">無料號</span>'}</div>`
        + `<div class="sub">${esc(c.l)}</div>`
        + (k.over ? `<div class="note danger">⚠ ${esc(k.over)}</div>` : '')
        + (c.issue && c.issue.length
            ? c.issue.map(x=>`<div class="note">${esc(x)}</div>`).join('') : '')
        + `</div></td>
      <td>${end(ea)}</td>
      <td>${end(eb)}</td>
      <td><span class="cmb">${ea.sp}G</span>
          <div class="sub">${ea.n}:${eb.n}</div></td>
      <td><span class="badge b-theoretical">theoretical</span></td>
      <td><button class="copy" data-ri="${ri}">複製整列</button></td>
    </tr>`;
  }).join('');

  tb.querySelectorAll('.aoclen').forEach(sel=>{
    sel.onchange = ()=>{
      const ri = +sel.dataset.ri, c = AC[aocCache[ri].ai];
      const k = (c.skus || [])[+sel.value] || {};
      const box = sel.closest('.part');
      box.querySelector('.aoc-m').textContent = k.m || c.id;
      box.querySelector('.aoc-p').innerHTML = k.p ? esc(k.p)
        : '<span class="nosku">無料號</span>';
    };
  });
  tb.querySelectorAll('.cp').forEach(btn=>{
    btn.onclick = ()=>copyText(TSV(aocTsv(+btn.dataset.ri).slice(0,3)), btn, '✓');
  });
  tb.querySelectorAll('.copy').forEach(btn=>{
    btn.onclick = ()=>{
      const t = aocTsv(+btn.dataset.ri);
      copyText([['Model Name','Part Number','Description','Qty'], t]
        .map(TSV).join('\n'), btn);
    };
  });
}

const cpBtnAoc = ri => `<button class="cp" data-ri="${ri}"`
  + ` title="複製 Model Name / Part Number / Description">⧉</button>`;

function renderResults(){
  $('resTitle').textContent = st.cat === 'x' ? '可對接的組合'
                                             : `可用的 ${catName()}`;
  if(st.cat !== 'x') return renderResultsAoc();
  const tb = $('res'), emp = $('resEmpty');
  $('resHead').innerHTML = HEAD_X;
  tb.innerHTML = ''; rowsCache = [];
  if(st.a.x === null){
    emp.style.display='block';
    emp.textContent='請先在左側選擇 A 端的交換器、埠位與模組。';
    return;
  }
  const targets = st.b.x !== null ? [st.b.x] : compatModules(st.b.sw, st.b.pg);
  const rows = mergeRows(pairRows(st.a.x, targets));
  const rank = {verified:0, supported:1, theoretical:2};
  rows.sort((p,q)=> rank[p.status]-rank[q.status]
                    || q.combos[0].sp - p.combos[0].sp
                    || X[p.xb].m.localeCompare(X[q.xb].m));
  if(!rows.length){
    emp.style.display='block';
    emp.innerHTML = st.b.x !== null ? whyNot(st.a.x, st.b.x)
      : `${esc(X[st.a.x].m)} 在 ${esc(P[st.b.sw].n)} 的此埠位上找不到可對接的模組。`;
    return;
  }
  emp.style.display='none'; emp.innerHTML='';
  rowsCache = rows;
  const a = X[st.a.x];

  tb.innerHTML = rows.map((r, ri)=>{
    const b = X[r.xb];
    // 兩端埠模式一致時只寫一次；不一致才拆成 A / B（例如 DR4 對 4 顆 DR1）
    const speeds = r.combos.map(c=>{
      const one = k => `${k}x${fmtSpeed(c.sp)}`;
      const t = c.ka === c.kb ? one(c.ka)
              : `A:${one(c.ka)} <-> B:${one(c.kb)}`;
      return `<span class="cmb">${esc(t)}</span>`;
    }).join('');
    const qty = r.ratio === 1 ? 'A 1 : B 1'
              : (r.big === 'A' ? `A 1 : B ${r.ratio}` : `A ${r.ratio} : B 1`);
    return `<tr>
      <td>${partCell(a.m, pnOf(a), a.d || '', a.f, cpBtn('a', ri), pnNote(a))}</td>
      <td>${partCell(b.m, pnOf(b), b.d || '', b.f, cpBtn('b', ri), pnNote(b))}</td>
      <td>${r.cab.length ? r.cab.map((i,ci)=>cableCell(i, ri, ci)).join('')
                         : '<span class="sub">不需外接線材</span>'}</td>
      <td>${speeds}<div class="sub">模組數量 ${esc(qty)}</div>
          <div class="sub">${esc(r.kind)}</div></td>
      <td><span class="badge b-${r.status}">${r.status}</span>
          ${r.notes.map(n=>`<div class="note${n.startsWith('⚠')?' danger':''}">`
                             + `${esc(n)}</div>`).join('')}</td>
      <td><button class="copy" data-ri="${ri}">複製整列</button></td>
    </tr>`;
  }).join('');

  // 換長度 -> 同步該線材的 model name / 料號 / 描述
  tb.querySelectorAll('.lensel').forEach(sel=>{
    sel.onchange = ()=>{
      const r = rowsCache[+sel.dataset.ri];
      const c = C[r.cab[+sel.dataset.ci]], k = (c.skus||[])[+sel.value] || {};
      const box = sel.closest('.cbl');
      box.querySelector('.cbl-m').textContent = k.m || c.id;
      box.querySelector('.cbl-p').innerHTML = k.p ? esc(k.p)
        : '<span class="nosku">無料號</span>';
      box.querySelector('.cbl-d').textContent = withLen(c.desc || c.l, k.L);
    };
  });
  tb.querySelectorAll('.cp').forEach(btn=>{
    btn.onclick = ()=>copyText(
      TSV(partTsv(btn.dataset.p, +btn.dataset.ri, +(btn.dataset.ci||0)).slice(0,3)),
      btn, '✓');
  });
  tb.querySelectorAll('.copy').forEach(btn=>{
    btn.onclick = ()=>copyText(bomLines(+btn.dataset.ri), btn);
  });
}

// 在「兩個面板」與「一條壓縮列」之間搬動下拉選單。
//
// ★ AOC/DAC 只有一條線要選，兩個大面板裡各只剩兩個下拉選單，空一大塊。
//   壓成一列，結果表就能拿到整個寬度 —— 那才是要看的東西。
function layout(){
  const cable = st.cat !== 'x';
  if(cable){
    $('cbA').appendChild($('rowA'));
    $('cbB').appendChild($('rowB'));
    $('cbMA').appendChild($('modeA'));
    $('cbMB').appendChild($('modeB'));
    $('cbar').style.display = '';
    $('grid').style.display = 'none';
  }else{
    // 搬回原位：homeA/homeB 是定位點，after 保證順序不會亂
    $('homeA').after($('rowA'), $('modeA'));
    $('homeB').after($('rowB'), $('modeB'));
    $('cbar').style.display = 'none';
    $('grid').style.display = '';
  }
  // ★ 所有「哪些元件在這個模式下要顯示」都集中在這裡。
  //   散在各個 render 函式裡藏東西，還原時一定會漏掉其中一個。
  //   用 id 直接抓，不用 closest 爬結構 —— 版面一改 closest 就會抓空。
  const hideInCable = ['onlyLinkWrap', 'qArow', 'qBrow', 'listA', 'listB'];
  hideInCable.forEach(k => $(k).style.display = cable ? 'none' : '');
  $('aocOnlyWrap').style.display = cable ? '' : 'none';
  if(cable) $('qA').value = '';
}

// ── 全品項清單 ──────────────────────────────────────────
//
// 把手上所有產品列出來，不受目前選的交換器/埠位影響。
// 項目的排版刻意跟左右兩邊的清單一致（.item > .mn + .md），
// 這樣同一顆模組在兩個地方看起來是同一個東西。
//
// ★ 這個浮層自己管自己的顯示，不經過 layout()。
const allSt = {kind: null};

// 光模組：跟 renderListA / renderListB 用同一組欄位
function allRowX(i){
  const x = X[i];
  return `<div class="item">
    <div class="mn">${esc(x.m)}<span class="tag">${esc(x.f)}</span>${x.hs?`<span class="tag">${esc(x.hs)}</span>`:''}${x.gb?'<span class="tag">gearbox</span>':''}${avlTag(x)}</div>
    <div class="md">${esc(x.s)} · ${esc(x.cn)} · ${esc(x.md)} · ${reach(i)}</div></div>`;
}

// 線材：AOC/DAC 兩端是焊死的，所以標記寫兩端封裝與埠模式
function allRowC(i){
  const c = AC[i];
  const lens = c.skus.map(k => k.L).sort((a,b)=>a-b);
  const ends = c.a.ff === c.b.ff && c.a.h === c.b.h
    ? `${esc(c.a.ff)}　${esc(c.a.h)}`
    : `${esc(c.a.ff)} ${esc(c.a.h)} ⟷ ${esc(c.b.ff)} ${esc(c.b.h)}`;
  return `<div class="item">
    <div class="mn">${esc(c.id)}<span class="tag">${c.kind === 'dac' ? 'DAC' : 'AOC'}</span><span class="tag">${ends}</span></div>
    <div class="md">${esc(c.l || '—')} · 長度 ${lens.join(' / ')} m（${c.skus.length} 個料號）</div></div>`;
}

function renderAll(){
  if(!allSt.kind) return;
  const xc = allSt.kind === 'x';
  const q = $('allQ').value.trim().toLowerCase();
  let ids, rows, total;
  if(xc){
    ids = X.map((_,i)=>i);
    total = ids.length;
    // 搜尋範圍要涵蓋項目上看得到的每一欄，否則會「看得到卻搜不到」
    ids = ids.filter(i => !q || (X[i].m+' '+X[i].s+' '+X[i].d+' '+X[i].f+' '
      +X[i].cn+' '+X[i].md+' '+(X[i].hs||'')).toLowerCase().includes(q));
    ids.sort((a,b)=> (X[b].sp - X[a].sp) || X[a].m.localeCompare(X[b].m));
    rows = ids.map(allRowX);
  }else{
    ids = AC.map((_,i)=>i);
    total = ids.length;
    ids = ids.filter(i => !q || (AC[i].id+' '+AC[i].l+' '+AC[i].a.ff+' '+AC[i].b.ff
      +' '+AC[i].a.h+' '+AC[i].b.h+' '+AC[i].kind).toLowerCase().includes(q));
    ids.sort((a,b)=> (AC[b].a.sp - AC[a].a.sp) || AC[a].id.localeCompare(AC[b].id));
    rows = ids.map(allRowC);
  }
  $('allCnt').textContent = `共 ${total} 種` + (q ? `，符合 ${ids.length} 種` : '');
  $('allBody').innerHTML = rows.length ? rows.join('')
    : '<div class="empty">沒有符合搜尋的項目。</div>';
}

function openAll(kind){
  allSt.kind = kind;
  $('allTitle').textContent = kind === 'x' ? '全部光模組' : '全部 AOC / DAC 線材';
  $('allQ').placeholder = kind === 'x' ? '搜尋型號或規格…' : '搜尋線材型號或封裝…';
  $('allQ').value = '';
  $('allOvl').hidden = false;
  renderAll();
  $('allQ').focus();
}

function closeAll(){ $('allOvl').hidden = true; allSt.kind = null; }

// ── 初始化 ──────────────────────────────────────────────
function bind(side, swSel, pgSel, modeEl, after){
  fillSwitches(swSel, side); fillGroups(pgSel, side); showModes(modeEl, side);
  swSel.onchange = ()=>{ st[side].sw = +swSel.value; st[side].pg = 0;
    fillGroups(pgSel, side); showModes(modeEl, side); after(); };
  pgSel.onchange = ()=>{ st[side].pg = +pgSel.value; showModes(modeEl, side); after(); };
}
// A 端換交換器或埠位 -> A 的選擇失效，B 的可對接清單也要跟著重算
bind('a', $('swA'), $('pgA'), $('modeA'),
     ()=>{ st.a.x=null; renderListA(); renderListB(); renderResults(); });
bind('b', $('swB'), $('pgB'), $('modeB'),
     ()=>{ st.b.x=null; renderListB(); renderResults(); });
$('catSel').querySelectorAll('button[data-cat]').forEach(b=>{
  b.onclick = ()=>{
    if(b.disabled) return;
    st.cat = b.dataset.cat;
    $('catSel').querySelectorAll('button').forEach(x=>
      x.classList.toggle('on', x === b));
    // 切換分類時清掉另一種的選擇，避免顯示到對不上的東西
    st.a.x = null; st.b.x = null; st.aoc = null;
    const q = $('qA');
    q.placeholder = st.cat === 'x' ? '搜尋型號或規格…'
      : `搜尋 ${catName()} 型號…`;
    layout();
    renderListA(); renderListB(); renderResults();
  };
});

// 全品項清單的開關。這兩個按鈕不是分類切換，按了不會動到 st.cat ——
// 所以不加 .on，也不碰 A/B 的選擇。
$('allSel').querySelectorAll('button[data-all]').forEach(b=>{
  b.onclick = ()=> openAll(b.dataset.all);
});
$('allClose').onclick = closeAll;
$('allQ').oninput = renderAll;
// 點背景關閉；點到內容區不關
$('allOvl').onclick = e =>{ if(e.target === $('allOvl')) closeAll(); };
document.addEventListener('keydown', e =>{
  if(e.key === 'Escape' && !$('allOvl').hidden) closeAll();
});

$('qA').oninput = ()=>{ renderListA(); renderListB(); renderResults(); };

$('aocOnly').onchange = renderResults;
$('qB').oninput = renderListB;
$('onlyLink').onchange = renderListB;
// 預設淺色；使用者切過就記住，重開維持同一個選擇
try{
  const saved = localStorage.getItem('theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}catch(e){}

$('theme').onclick = ()=>{
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
};

const nSw = P.filter(p=>(p.k||'switch')==='switch').length;
$('stat').innerHTML = `${nSw} 台交換器 · ${P.length-nSw} 種網卡 · `
  + `${X.length} 顆模組 · ${C.length} 種光纖線 · `
  + `${AC.filter(c=>c.kind==='aoc').length} 種 AOC · `
  + `${AC.filter(c=>c.kind==='dac').length} 種 DAC`
  + ` <span class="help" tabindex="0">!<span class="tip">${namingTip()}</span></span>`;

// 命名慣例小抄。資料在 data/naming.yaml，這裡只負責排版。
function namingTip(){
  const tbl = (rows) => `<table>${rows}</table>`;
  const pre = N.prefixes.map(p =>
    `<tr><td class="k">${esc(p.id)}</td><td>${esc(p.speed)}</td>`
    + `<td>${esc(p.ff)}</td>`
    + `<td class="n">${esc(p.aka || '')}</td></tr>`).join('');
  const suf = N.suffixes.map(p =>
    `<tr><td class="k">${esc(p.id)}</td><td>${esc(p.media)}</td>`
    + `<td>${esc(p.reach)}</td><td class="n">${esc(p.note || '')}</td></tr>`).join('');
  const mk = N.markers.map(p =>
    `<tr><td class="k">${esc(p.id)}</td><td class="n">${esc(p.note)}</td></tr>`).join('');
  return `<b>型號前綴 → 速率 · 封裝</b>${tbl(pre)}`
       + `<b>PMD 後綴（後面的數字是通道數，不是速率）</b>${tbl(suf)}`
       + `<b>其他記號</b>${tbl(mk)}`;
}
$('foot').innerHTML =
  '判斷依據為模組與平台的電氣與光學規格。實際佈署仍須確認 NOS 版本與模組韌體支援對應的速率與 breakout 模式。'
  + '<br>標示 <b>theoretical</b> 的組合表示規格由標準推導而未經原廠規格書逐項確認，導入前請先與 Edgecore 確認。';

layout();
renderListA(); renderListB(); renderResults();
</script>
</body>
</html>
